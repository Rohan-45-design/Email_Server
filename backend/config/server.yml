server:
  host: "0.0.0.0"
  smtp_port: 25
  imap_port: 143
  imaps_port: 993
  domain: "localhost"
  mail_root: "data/mail"
  tls_required: false
  require_starttls: true
  min_tls_version: 3

tls:
  enabled: true
  cert_file: "certs/server.crt"
  key_file: "certs/server.key"

smtp:
  max_message_size: 10485760
  timeout: 300
  data_timeout: 600

logging:
  file: "mailserver.log"
  level: "info"

auth:
  users_file: "config/users.yml"

ha:
  enabled: false   # 🔴 DISABLE FOR LOCAL TESTING

admin:
  token: "dev-token"

rate_limits:
  global_max_connections: 100
